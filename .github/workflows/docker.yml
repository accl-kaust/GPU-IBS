# The container image: built and tested on every push and pull request,
# published on pushes to main (tag "latest") and on version tags vX.Y.Z
# (tags "X.Y.Z" and "X.Y") to two registries:
#   docker.io/ahmadshakleya/gpu-ibs  when the repository secrets
#       DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub access token
#       with Read & Write) are set; without them Docker Hub is skipped
#   ghcr.io/<owner>/gpu-ibs  make the package public once in the
#       repository's Packages settings so `docker pull` needs no login
name: docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/gpu-ibs
  DOCKERHUB_IMAGE: docker.io/ahmadshakleya/gpu-ibs

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      HAVE_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Free disk space (the CUDA build image is ~8 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            name=${{ env.IMAGE }}
            name=${{ env.DOCKERHUB_IMAGE }},enable=${{ env.HAVE_DOCKERHUB }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: gpu-ibs:ci
          build-args: |
            BUILD_JOBS=4
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Host test suite inside the build (docker build --target test)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          build-args: BUILD_JOBS=4
          cache-from: type=gha
      - name: Selftest of the image (CPU path; the runners have no GPU)
        run: |
          docker run --rm gpu-ibs:ci gpu-ibs info
          docker run --rm gpu-ibs:ci gpu-ibs selftest
          mkdir -p example && docker run --rm -u "$(id -u):$(id -g)" -v "$PWD/example":/data gpu-ibs:ci gpu-ibs example
      - name: Log in to the GitHub container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && env.HAVE_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_JOBS=4
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
